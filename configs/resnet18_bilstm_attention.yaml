seed: 42

data:
  image_size: 224
  target_fps: 10

training:
  batch_size: 2
  epochs: 6
  learning_rate: 0.0001
  weight_decay: 0.0001

model:
  name: resnet18
  pretrained: true
  num_classes: 2
  temporal:
    enabled: true
    model: bilstm_attention
    lstm_layers: 1
    lstm_hidden: 128
    attention_dim: 128
    dropout: 0.3
    sequence_length: 16
    stride: 16
