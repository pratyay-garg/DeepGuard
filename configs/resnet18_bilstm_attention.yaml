seed: 42

data:
  image_size: 224
  target_fps: 10

training:
  batch_size: 8
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001

model:
  name: resnet18
  pretrained: true
  num_classes: 2
  temporal:
    enabled: true
    model: bilstm_attention
    lstm_layers: 2
    lstm_hidden: 256
    attention_dim: 256
    dropout: 0.3
    sequence_length: 32
    stride: 32
