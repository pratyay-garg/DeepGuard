seed: 42

data:
  image_size: 224
  target_fps: 10

training:
  # batch_size: 8
  batch_size: 2
  accumulation_steps: 4
  epochs: 1 #15
  learning_rate: 0.0001
  weight_decay: 0.0001

model:
  name: resnet18
  pretrained: true
  num_classes: 2
  temporal:
    enabled: true
    model: tsm
    sequence_length: 32
    stride: 32
